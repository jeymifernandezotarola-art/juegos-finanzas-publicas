<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ahorcado | Finanzas Públicas</title><style>:root{font-family:system-ui,Arial;background:#0e1930;color:#f4f7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#23406c,#0e1930 65%)}main{width:min(760px,100%);background:#172845;border:1px solid #385078;border-radius:24px;padding:26px;box-shadow:0 20px 50px #0005}h1{margin:0 0 6px;font-size:clamp(26px,5vw,39px)}p{line-height:1.5;color:#c7d6f1}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.chip{background:#28446b;padding:8px 12px;border-radius:20px;font-weight:700}.word{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:26px 0}.letter{width:clamp(28px,6vw,45px);height:52px;border-bottom:3px solid #70e0d0;display:grid;place-items:center;font-size:clamp(21px,4vw,30px);font-weight:800}.keyboard{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}button{border:0;border-radius:10px;padding:12px 14px;background:#e5efff;color:#10223e;font-weight:800;cursor:pointer;font-size:15px}button:disabled{opacity:.35;cursor:default}.primary{background:#71e1d0}.message{min-height:52px;font-weight:700;color:#fff}#figure{height:145px;display:block;margin:auto}svg line,svg circle{stroke:#f5b567;stroke-width:5;fill:none;stroke-linecap:round}.hide{visibility:hidden}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.small{font-size:13px}</style></head><body><main><div class="top"><div><h1>🔤 Ahorcado fiscal</h1><p>Descubre los 3 conceptos clave de los ingresos públicos.</p></div><div><div class="chip" id="round"></div><div class="chip" id="score" style="margin-top:8px"></div></div></div><p id="hint"></p><svg id="figure" viewBox="0 0 200 160" aria-label="Intentos restantes"><line x1="25" y1="150" x2="120" y2="150"/><line x1="65" y1="150" x2="65" y2="12"/><line x1="65" y1="12" x2="135" y2="12"/><line x1="135" y1="12" x2="135" y2="33"/><circle class="part hide" cx="135" cy="48" r="15"/><line class="part hide" x1="135" y1="63" x2="135" y2="104"/><line class="part hide" x1="135" y1="74" x2="105" y2="90"/><line class="part hide" x1="135" y1="74" x2="165" y2="90"/><line class="part hide" x1="135" y1="104" x2="110" y2="132"/><line class="part hide" x1="135" y1="104" x2="160" y2="132"/></svg><div class="word" id="word" aria-live="polite"></div><div class="keyboard" id="keyboard"></div><p class="message" id="message" aria-live="polite"></p><div class="footer"><span class="small">6 errores permitidos por palabra · 100 puntos máximo</span><button class="primary" id="next" hidden>Siguiente concepto →</button></div><p class="small">Actividad académica de Finanzas Públicas · Jeimy Fernández · Basada en «Importancia de los ingresos públicos».</p></main><script>const concepts=[{word:'RECAUDACION',hint:'Proceso por el cual el Estado obtiene recursos para financiar el gasto público.',explain:'La recaudación sostiene servicios como salud, educación, seguridad e infraestructura.'},{word:'EQUIDAD',hint:'Principio de justicia que busca un tratamiento tributario acorde con la capacidad económica.',explain:'La equidad horizontal compara capacidades semejantes; la vertical considera capacidades diferentes.'},{word:'EXONERACION',hint:'Beneficio legal que permite no pagar un tributo que normalmente correspondería.',explain:'Las exoneraciones son una forma de gasto tributario y deben evaluarse por su costo y beneficio social.'}];let index=0,used=new Set(),errors=0,points=0,finished=false;const $=id=>document.getElementById(id);function render(){const c=concepts[index];$('round').textContent=`Concepto ${index+1} de 3`;$('score').textContent=`Puntos: ${points}/100`;$('hint').textContent='💡 Pista: '+c.hint;$('word').innerHTML=[...c.word].map(x=>`<span class="letter">${used.has(x)?x:' '}</span>`).join('');$('keyboard').innerHTML='ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('').map(x=>`<button ${used.has(x)||finished?'disabled':''} data-key="${x}">${x}</button>`).join('');document.querySelectorAll('.part').forEach((el,i)=>el.classList.toggle('hide',i>=errors));$('keyboard').querySelectorAll('button').forEach(b=>b.onclick=()=>guess(b.dataset.key));}function guess(ch){if(finished||used.has(ch))return;used.add(ch);const c=concepts[index];if(!c.word.includes(ch))errors++;const won=[...c.word].every(x=>used.has(x));if(won||errors>=6){finished=true;if(won){const value=index===2?34:33;points+=value;$('message').textContent=`✅ ¡Correcto! ${c.explain} (+${value} puntos)`;}else $('message').textContent=`❌ La palabra era ${c.word}. ${c.explain}`;$('next').hidden=false;$('next').textContent=index===2?'Ver resultado final':'Siguiente concepto →';}render();}function start(){index=0;points=0;load();}function load(){used=new Set();errors=0;finished=false;$('message').textContent='Elige letras para completar la palabra.';$('next').hidden=true;render();}$('next').onclick=()=>{if(index<2){index++;load();}else{const total=points;$('hint').textContent='🎉 ¡Terminaste los tres conceptos!';$('word').innerHTML=`<strong style="font-size:40px">${total}/100 puntos</strong>`;$('keyboard').innerHTML='';$('message').textContent=total===100?'¡Excelente dominio de los conceptos!':'¡Buen trabajo! Puedes repetir para mejorar tu puntuación.';$('next').textContent='Volver a jugar';$('next').hidden=false;$('next').onclick=()=>{ $('next').onclick=nextHandler;start();};}};const nextHandler=$('next').onclick;document.addEventListener('keydown',e=>{const key=e.key.toUpperCase();if(/^[A-ZÑ]$/.test(key))guess(key)});load();</script></body></html>
